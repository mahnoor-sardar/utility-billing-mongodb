storage:
  dbPath: ./data/rs3
systemLog:
  destination: file
  path: ./data/rs3/mongod.log
  logAppend: true
net:
  port: 27019
  bindIp: 127.0.0.1
replication:
  replSetName: rs0
# Uncomment after creating users (see admin/rbac/README):
security:
  authorization: enabled
  keyFile: ./admin/replica-set/rs-keyfile
